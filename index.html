<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MouseLens</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --fg: #172033;
      --muted: #5c6578;
      --panel: #ffffff;
      --border: #d9deea;
      --accent: #2f6df6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101420;
        --fg: #eef2fb;
        --muted: #aeb6c8;
        --panel: #171d2b;
        --border: #30384c;
        --accent: #7aa2ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(820px, calc(100% - 32px));
      margin: 48px auto;
      padding: 36px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      max-width: 640px;
    }

    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    a {
      color: var(--accent);
    }

    .button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <h1>MouseLens</h1>
    <p>MouseLens is a macOS screen recording and editing app for creating polished walkthrough videos with cursor reconstruction, click feedback, zoom moments, trimming, backgrounds, padding, rounded corners, and MP4 export.</p>

    <nav>
      <a class="button" href="support.html">Support</a>
      <a class="button" href="privacy.html">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
